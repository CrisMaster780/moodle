server {
    listen 80;
    server_name plataforma.innova.net.py;
    client_max_body_size 2g;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://plataforma.innova.net.py$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name plataforma.innova.net.py;
    ssl_certificate /etc/letsencrypt/live/plataforma.innova.net.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma.innova.net.py/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2g;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;

    location / {
        proxy_pass http://192.168.18.66:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
