name: moodle-production

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Set MOODLE_DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    environment: &moodle_environment
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Set MOODLE_DB_PASSWORD in .env.production}
      MOODLE_WWWROOT: https://${MOODLE_DOMAIN:?Set MOODLE_DOMAIN in .env.production}
      MOODLE_SSLPROXY: "1"
    volumes: &moodle_volumes
      - ./:/var/www/moodle:ro
      - moodle_data:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build: .
    user: www-data
    environment: *moodle_environment
    volumes: *moodle_volumes
    command: ["sh", "-c", "while :; do php admin/cli/cron.php; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2
    environment:
      MOODLE_DOMAIN: ${MOODLE_DOMAIN:?Set MOODLE_DOMAIN in .env.production}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  moodle_data:
  caddy_data:
  caddy_config:
