services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:?Create .env using ./setup-moodle.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    environment: &moodle_environment
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Create .env using ./setup-moodle.sh}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
    volumes: &moodle_volumes
      - ./:/var/www/moodle:ro
      - moodle_data:/var/www/moodledata
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build: .
    user: www-data
    environment: *moodle_environment
    volumes: *moodle_volumes
    command: ["sh", "-c", "while :; do php admin/cli/cron.php; sleep 60; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  moodle_data:
