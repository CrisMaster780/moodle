<script>
document.addEventListener('DOMContentLoaded', function() {
    if (document.body.id !== 'page-my-index' || document.body.classList.contains('editing')) {
        return;
    }

    const main = document.querySelector('#page .main-inner');
    const header = document.getElementById('page-header');
    const content = document.getElementById('page-content');
    const overview = document.querySelector('.block_myoverview');
    if (!main || !header || !content || !overview || main.querySelector('.innova-dashboard-layout')) {
        return;
    }

    overview.id = 'innova-mis-cursos';
    const timeline = document.querySelector('.block_timeline');
    if (timeline) {
        timeline.id = 'innova-pendientes';
    }

    const layout = document.createElement('div');
    layout.className = 'innova-dashboard-layout';
    const sidebar = document.createElement('aside');
    sidebar.className = 'innova-dashboard-sidebar';
    sidebar.innerHTML = '<div class="innova-dashboard-sidebar__brand"><span class="innova-dashboard-sidebar__mark">i</span><span><strong>Innova</strong><small>Aula virtual</small></span></div>' +
        '<nav aria-label="Navegación del estudiante"><span class="innova-dashboard-sidebar__eyebrow">TU ESPACIO</span>' +
        '<a class="innova-dashboard-sidebar__link is-active" href="/my/" aria-current="page">Área personal</a>' +
        '<a class="innova-dashboard-sidebar__link" href="#innova-mis-cursos">Mis cursos</a>' +
        (timeline ? '<a class="innova-dashboard-sidebar__link" href="#innova-pendientes">Pendientes</a>' : '') +
        '<span class="innova-dashboard-sidebar__eyebrow innova-dashboard-sidebar__eyebrow--courses">TUS CURSOS</span>' +
        '<div class="innova-dashboard-sidebar__courses"></div></nav>';
    const workspace = document.createElement('div');
    workspace.className = 'innova-dashboard-workspace';
    const blocksDrawer = document.getElementById('theme_boost-drawers-blocks');
    const blocks = blocksDrawer?.querySelector('.drawercontent > .d-print-none');
    const rightRail = blocks ? document.createElement('aside') : null;
    if (rightRail) {
        rightRail.className = 'innova-dashboard-rail';
        rightRail.setAttribute('aria-label', 'Calendario y actividad reciente');
        rightRail.appendChild(blocks);
    }
    const headerShell = header.closest('.header-maxwidth') || header;
    main.insertBefore(layout, headerShell);
    layout.append(sidebar, workspace);
    if (rightRail) {
        layout.appendChild(rightRail);
        document.body.classList.add('innova-dashboard-ready');
    }
    workspace.append(headerShell, content);

    const eyebrow = document.createElement('span');
    eyebrow.className = 'innova-dashboard-eyebrow';
    eyebrow.textContent = 'TU AULA, A TU RITMO';
    header.prepend(eyebrow);
    const intro = document.createElement('div');
    intro.className = 'innova-dashboard-intro';
    const copy = document.createElement('div');
    copy.className = 'innova-dashboard-intro__copy';
    const description = document.createElement('p');
    description.textContent = 'Continúa donde te quedaste y avanza clase por clase.';
    const coursesLink = document.createElement('a');
    coursesLink.className = 'innova-dashboard-intro__action';
    coursesLink.href = '#innova-mis-cursos';
    coursesLink.textContent = 'Explorar mis cursos';
    copy.append(description, coursesLink);
    const next = document.createElement('div');
    next.className = 'innova-dashboard-next';
    const label = document.createElement('span');
    label.className = 'innova-dashboard-next__label';
    label.textContent = 'CONTINÚA APRENDIENDO';
    const title = document.createElement('a');
    title.className = 'innova-dashboard-next__title';
    title.href = '#innova-mis-cursos';
    title.textContent = 'Elige un curso para continuar';
    const detail = document.createElement('span');
    detail.className = 'innova-dashboard-next__detail';
    detail.textContent = 'Tus clases están justo debajo';
    next.append(label, title, detail);
    intro.append(copy, next);
    header.appendChild(intro);

    const sectionTitle = overview.querySelector('.card-title');
    if (sectionTitle) {
        sectionTitle.textContent = 'Tus cursos';
    }
    const timelineTitle = timeline?.querySelector('.card-title');
    if (timelineTitle) {
        timelineTitle.textContent = 'Próximas actividades';
    }

    const readProgress = function(card) {
        const text = card.querySelector('.progress-text')?.textContent || '';
        const match = text.match(/(\d+(?:[.,]\d+)?)\s*%/);
        return match ? Number(match[1].replace(',', '.')) : 0;
    };

    const updateCourses = function() {
        const cards = Array.from(overview.querySelectorAll('.course-card'));
        if (!cards.length) {
            return false;
        }
        const list = sidebar.querySelector('.innova-dashboard-sidebar__courses');
        list.replaceChildren();
        for (const card of cards) {
            const courseLink = card.querySelector('a.coursename');
            if (!courseLink) {
                continue;
            }
            const name = courseLink.querySelector('.multiline[title]')?.getAttribute('title') || courseLink.textContent.trim();
            const sideLink = document.createElement('a');
            sideLink.className = 'innova-dashboard-sidebar__course';
            sideLink.href = courseLink.href;
            sideLink.textContent = name;
            list.appendChild(sideLink);

            const progress = readProgress(card);
            const cardBody = card.querySelector('.course-info-container');
            if (cardBody && !cardBody.querySelector('.innova-course-progress')) {
                const track = document.createElement('div');
                track.className = 'innova-course-progress';
                track.setAttribute('aria-hidden', 'true');
                const fill = document.createElement('span');
                fill.style.width = Math.min(100, Math.max(0, progress)) + '%';
                track.appendChild(fill);
                cardBody.appendChild(track);
            }
        }
        const featured = cards.find(function(card) {
            const progress = readProgress(card);
            return progress > 0 && progress < 100;
        }) || cards[0];
        const featuredLink = featured.querySelector('a.coursename');
        if (featuredLink) {
            title.href = featuredLink.href;
            title.textContent = featuredLink.querySelector('.multiline[title]')?.getAttribute('title') || featuredLink.textContent.trim();
            detail.textContent = featured.querySelector('.progress-text')?.textContent.trim() || 'Abre el curso para empezar';
        }
        return true;
    };

    if (!updateCourses()) {
        const observer = new MutationObserver(function() {
            if (updateCourses()) {
                observer.disconnect();
            }
        });
        observer.observe(overview, {childList: true, subtree: true});
    }
});
</script>
