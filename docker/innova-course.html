<script>
    document.addEventListener('DOMContentLoaded', function() {
        if ((document.body.classList.contains('path-course-view') || document.body.classList.contains('path-mod')) &&
                window.matchMedia('(min-width: 992px)').matches) {
            const drawer = document.getElementById('theme_boost-drawers-courseindex');
            if (drawer && !drawer.classList.contains('show') && typeof window.require === 'function') {
                window.require(['theme_boost/drawers'], function(module) {
                    const Drawers = module.default || module;
                    if (!drawer.classList.contains('show')) {
                        Drawers.getDrawerInstanceForNode(drawer).openDrawer({focusOnCloseButton: false});
                    }
                });
            }
        }

        if (!document.body.classList.contains('path-course-view') || document.body.classList.contains('editing')) {
            return;
        }

        const content = document.querySelector('.course-content');
        if (!content) {
            return;
        }
        const sections = Array.from(content.querySelectorAll('.course-section[data-number]'))
            .filter(function(section) { return Number(section.dataset.number) > 0; });
        if (!sections.length) {
            return;
        }

        let classCount = 0;
        let exerciseCount = 0;
        let firstLesson = null;
        sections.forEach(function(section) {
            const activities = Array.from(section.querySelectorAll('li.activity:not(.hiddenactivity)'));
            activities.forEach(function(activity) {
                const nameArea = activity.querySelector('.activity-name-area');
                const link = activity.querySelector('.activityname a');
                if (!nameArea || !link) {
                    return;
                }
                if (!firstLesson) {
                    firstLesson = link;
                }

                const isExercise = activity.classList.contains('modtype_assign') ||
                    activity.classList.contains('modtype_quiz') ||
                    activity.classList.contains('modtype_h5pactivity');
                const isVideo = activity.classList.contains('modtype_file') ||
                    /v[ií]deo|video/i.test(link.textContent);
                const kind = isExercise ? 'Ejercicio' : (isVideo ? 'Video' : 'Clase');
                if (isExercise) {
                    exerciseCount++;
                } else {
                    classCount++;
                }
                const badge = document.createElement('span');
                badge.className = 'innova-activity-kind';
                badge.textContent = kind;
                nameArea.appendChild(badge);
            });
            const header = section.querySelector('.course-section-header');
            if (header && activities.length) {
                const meta = document.createElement('span');
                meta.className = 'innova-section-meta';
                meta.textContent = activities.length + (activities.length === 1 ? ' actividad' : ' actividades');
                header.appendChild(meta);
            }
        });

        const hero = document.createElement('section');
        hero.className = 'innova-course-hero';
        hero.setAttribute('aria-label', 'Ruta de aprendizaje');
        hero.innerHTML = '<div><div class="innova-course-hero__eyebrow">Tu ruta de aprendizaje</div>' +
            '<h2>Aprende a tu ritmo</h2>' +
            '<p>Recorre las clases en orden y completa los ejercicios para poner en práctica lo aprendido.</p>' +
            '<div class="innova-course-hero__stats"></div></div>' +
            '<a class="innova-course-hero__start">Comenzar la primera clase</a>';
        const stats = hero.querySelector('.innova-course-hero__stats');
        [sections.length + ' módulos', classCount + ' clases', exerciseCount + ' ejercicios'].forEach(function(label) {
            const item = document.createElement('span');
            item.textContent = label;
            stats.appendChild(item);
        });
        const start = hero.querySelector('.innova-course-hero__start');
        if (firstLesson) {
            start.href = firstLesson.href;
        } else {
            start.remove();
        }
        content.prepend(hero);
    });
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const frame = document.querySelector('body.path-mod-page .innova-lesson-video');
    const video = frame?.querySelector('video');
    if (!video || frame.querySelector('.innova-lesson-video__expand')) {
        return;
    }

    // Chrome's native video fullscreen keeps the inline lesson dimensions.
    // Use the player frame instead, so the video can fill the available screen.
    video.setAttribute('controlslist', 'nofullscreen');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'innova-lesson-video__expand';
    button.textContent = '⛶ Pantalla completa';
    button.setAttribute('aria-label', 'Ver video en pantalla completa');
    button.setAttribute('aria-pressed', 'false');
    frame.appendChild(button);

    const drawer = document.getElementById('theme_boost-drawers-courseindex');
    let drawerWasOpen = false;
    let fullscreenSession = false;
    let restoreTimer = null;

    const closeCourseIndex = function() {
        if (!drawer?.classList.contains('show') || typeof window.require !== 'function') {
            return;
        }
        window.require(['theme_boost/drawers'], function(module) {
            const Drawers = module.default || module;
            if (fullscreenSession && drawer.classList.contains('show')) {
                Drawers.getDrawerInstanceForNode(drawer).closeDrawer({
                    focusOnOpenButton: false,
                    updatePreferences: false
                });
            }
        });
    };

    const restoreCourseIndex = function() {
        if (!drawerWasOpen || !drawer || drawer.classList.contains('show') ||
                document.fullscreenElement || frame.classList.contains('is-expanded') ||
                !window.matchMedia('(min-width: 992px)').matches) {
            return;
        }
        if (typeof window.require === 'function') {
            window.require(['theme_boost/drawers'], function(module) {
                const Drawers = module.default || module;
                if (!fullscreenSession && !drawer.classList.contains('show')) {
                    Drawers.getDrawerInstanceForNode(drawer).openDrawer({
                        focusOnCloseButton: false,
                        setUserPref: false
                    });
                }
            });
        } else {
            document.querySelector('[data-toggler="drawers"][data-target="theme_boost-drawers-courseindex"]')?.click();
        }
    };

    const finishFullscreenSession = function() {
        if (!fullscreenSession) {
            return;
        }
        fullscreenSession = false;
        window.clearTimeout(restoreTimer);
        // Wait until Moodle's debounced resize handler has finished.
        restoreTimer = window.setTimeout(restoreCourseIndex, 650);
    };

    const syncButton = function() {
        const active = document.fullscreenElement === frame || frame.classList.contains('is-expanded');
        button.textContent = active ? 'Salir de pantalla completa' : '⛶ Pantalla completa';
        button.setAttribute('aria-pressed', String(active));
        button.setAttribute('aria-label', active ? 'Salir de pantalla completa' : 'Ver video en pantalla completa');
    };

    button.addEventListener('click', async function() {
        if (document.fullscreenElement === frame) {
            await document.exitFullscreen();
            finishFullscreenSession();
        } else if (frame.classList.contains('is-expanded')) {
            frame.classList.remove('is-expanded');
            document.body.classList.remove('innova-video-expanded');
            finishFullscreenSession();
        } else {
            window.clearTimeout(restoreTimer);
            drawerWasOpen = !!drawer?.classList.contains('show');
            fullscreenSession = true;
            closeCourseIndex();
            try {
                await frame.requestFullscreen();
            } catch (error) {
                frame.classList.add('is-expanded');
                document.body.classList.add('innova-video-expanded');
            }
        }
        syncButton();
    });

    document.addEventListener('fullscreenchange', function() {
        syncButton();
        if (!document.fullscreenElement && !frame.classList.contains('is-expanded')) {
            finishFullscreenSession();
        }
    });
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && frame.classList.contains('is-expanded')) {
            frame.classList.remove('is-expanded');
            document.body.classList.remove('innova-video-expanded');
            syncButton();
            finishFullscreenSession();
        }
    });
});
</script>
